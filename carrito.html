<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Carrito - GameVibe</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet" crossorigin="anonymous">
  <link rel="stylesheet" href="css/style.css">
</head>

<body>
<div id="navbar-placeholder"></div>
<script>
  fetch('components/navbar.html').then(r => r.text()).then(html => document.getElementById('navbar-placeholder').innerHTML = html).catch(() => {});
</script>

<main class="container my-5">
  <h1 class="h4 mb-4">Tu carrito</h1>

  <!-- Contenedor del carrito -->
  <div id="cart-container">
    <div class="text-muted">Cargando carrito...</div>
  </div>

  <!-- Controles de Total y Vaciar -->
  <div class="mt-4 d-flex justify-content-between align-items-center flex-wrap gap-3">
    <div>
      <button id="clear-cart" class="btn btn-outline-danger">Vaciar carrito</button>
    </div>
    <div class="text-end">
      <div class="small text-muted">Total:</div>
      <div id="cart-total" class="fs-4 fw-bold">$0</div>
      <button id="checkout" class="btn btn-primary mt-2">Pagar</button>
    </div>
  </div>
</main>

<div id="footer-placeholder"></div>
<script>
  fetch('components/footer.html').then(r => r.text()).then(html => document.getElementById('footer-placeholder').innerHTML = html).catch(() => {});
</script>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/js/bootstrap.bundle.min.js" crossorigin="anonymous"></script>
<!-- SweetAlert2 -->
<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

<!-- Archivo JS con la lógica -->
<script src="Javascript/carrito.js"></script>

<script>
  function formatCurrency(n) {
    return new Intl.NumberFormat('es-CL', { style: 'currency', currency: 'CLP', maximumFractionDigits: 0 }).format(n);
  }

  function renderCart() {
    const cart = Cart.getCart();
    const container = document.getElementById('cart-container');

    if (!cart || cart.length === 0) {
      container.innerHTML = '<div class="alert alert-secondary">Tu carrito está vacío.</div>';
      document.getElementById('cart-total').textContent = formatCurrency(0);
      return;
    }

    const rows = cart.map(it => {
      const priceNumber = it.priceNum || Cart.parsePrice(it.price);
      const subtotal = priceNumber * (it.qty || 0);

      return `
        <div class="card mb-2 shadow-sm">
          <div class="card-body p-3">
            <div class="row align-items-center g-3">
              <div class="col-auto">
                <img src="${it.img || 'img/placeholder.png'}" alt="${it.title}" style="width: 55px; height: 55px; object-fit: cover; border-radius: 6px;">
              </div>
              <div class="col">
                <h6 class="mb-1">${it.title}</h6>
                <div class="text-muted small">SKU: ${it.sku || 'N/A'} • ${it.price}</div>
              </div>
              <div class="col-auto">
                <label class="small d-block text-muted">Cant.</label>
                <input data-id="${it.id}" type="number" min="1" max="99" value="${it.qty}" class="form-control form-control-sm cart-qty" style="width: 65px;">
              </div>
              <div class="col-auto text-end" style="min-width: 90px;">
                <div class="small text-muted">Subtotal</div>
                <div class="fw-bold">${formatCurrency(subtotal)}</div>
              </div>
              <div class="col-auto">
                <button data-id="${it.id}" class="btn btn-sm btn-outline-danger remove-item" title="Eliminar producto">
                  <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor" class="bi bi-trash" viewBox="0 0 16 16">
                    <path d="M5.5 5.5A.5.5 0 0 1 6 6v6a.5.5 0 0 1-1 0V6a.5.5 0 0 1 .5-.5zm2.5 0a.5.5 0 0 1 .5.5v6a.5.5 0 0 1-1 0V6a.5.5 0 0 1 .5-.5zm3 .5a.5.5 0 0 0-1 0v6a.5.5 0 0 0 1 0V6z"/>
                    <path fill-rule="evenodd" d="M14.5 3a1 1 0 0 1-1 1H13v9a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V4h-.5a1 1 0 0 1-1-1V2a1 1 0 0 1 1-1H6a1 1 0 0 1 1-1h2a1 1 0 0 1 1 1h3.5a1 1 0 0 1 1 1v1zM4.118 4 4 4.059V13a1 1 0 0 0 1 1h6a1 1 0 0 0 1-1V4.059L11.882 4H4.118zM2.5 3V2h11v1h-11z"/>
                  </svg>
                </button>
              </div>
            </div>
          </div>
        </div>
      `;
    }).join('');

    container.innerHTML = rows;
    document.getElementById('cart-total').textContent = formatCurrency(Cart.getTotal());

    document.querySelectorAll('.cart-qty').forEach(input => {
      input.addEventListener('change', function () {
        Cart.updateQty(this.dataset.id, Math.max(1, parseInt(this.value || '1', 10)));
        renderCart();
      });
    });

    document.querySelectorAll('.remove-item').forEach(btn => {
      btn.addEventListener('click', function () {
        Cart.removeItem(this.dataset.id);
        renderCart();
      });
    });
  }

  document.getElementById('clear-cart').addEventListener('click', function () {
    Cart.clear();
    renderCart();
  });

  // LLAMADA A LA FUNCIÓN DEL JS AL PRESIONAR PAGAR
  document.getElementById('checkout').addEventListener('click', function () {
    Cart.processPayment('Game_Vibe_Store.html');
  });

  renderCart();
</script>
</body>

</html>
